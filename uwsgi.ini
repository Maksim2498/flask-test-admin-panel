[uwsgi]
module = server.__main__:app
pyargv = --secret-filename /app/data/secret.key --pickle-storage-dirname /app/data/db.pickle --sqlite3-storage-filename /app/data/db.sqlite3 --enabled-storages $(ENABLED_STORAGES) --postgres-host $(POSTGRES_HOST) --postgres-port $(POSTGRES_PORT) --postgres-db $(POSTGRES_DB) --postgres-user $(POSTGRES_USER) --postgres-password $(POSTGRES_PASSWORD) --mongodb-host $(MONGODB_HOST) --mongodb-port $(MONGODB_PORT) --mongodb-db $(MONGODB_DB) --mongodb-user=$(MONGODB_USER) --mongodb-password=$(MONGODB_PASSWORD) --rabbitmq-url=$(RABBITMQ_URL) --rabbitmq-rpc-queue=$(RABBITMQ_RPC_QUEUE) --rabbitmq-rpc-timeout=$(RABBITMQ_RPC_TIMEOUT)
